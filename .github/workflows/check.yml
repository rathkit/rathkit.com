name: check

# Builds the site and runs its checks (page metadata, links and anchors, image alt text, contrast) on every pull request, so a change
# that breaks them cannot be merged. The deploy workflow does the same build on main but is not run for pull requests.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm and Node in one step; the install is its own step so that it runs without install scripts, as the deploy does.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm check
