name: Bug report
description: Something on the site or docs is wrong or broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security problems, do not file an issue. See the security policy.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
